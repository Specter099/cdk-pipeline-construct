[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specter-pipeline"
version = "0.3.0"
description = "Shared CDK construct for CodePipeline + CodeBuild pipelines (Lambda compute, EC2 for long steps) across Specter099 repos"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.0.0",
]

[tool.setuptools.packages.find]
include = ["specter_pipeline*"]
